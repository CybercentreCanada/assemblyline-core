services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.3
    environment:
      - xpack.security.enabled=true
      - discovery.type=single-node
      - logger.level=WARN
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - ELASTIC_PASSWORD=devpass
    tmpfs:
      - /usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --silent --fail -u elastic:$$ELASTIC_PASSWORD localhost:9200/_cluster/health || exit 1",
        ]
      interval: 30s
      timeout: 30s
      retries: 3

  redis:
    image: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3

  pytest:
    build:
      context: ../..
      dockerfile: assemblyline-core/test/Dockerfile
      args:
        - PYTHON_VERSION=${PYTHON_VERSION:-3.14}
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${PATH_REWRITE:-.}/config/:/etc/assemblyline/
      - ${ROOT_REWRITE:-../../assemblyline-base}:/opt/alv4/assemblyline-base
      - ${ROOT_REWRITE:-../}:/opt/alv4/assemblyline-core
    working_dir: /opt/alv4/assemblyline-core
    command: "pytest -vv --full-trace"
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    network_mode: "host"
